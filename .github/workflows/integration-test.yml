name: Integration Test - CARE DICOM Enabler

# Tests the three headless DICOM services end-to-end:
#   MWL SCP  (port 2008) - C-ECHO + C-FIND via mock CARE backend
#   Store SCP (port 2007) - C-ECHO + C-STORE with a synthetic DICOM file
#
# Does NOT test the WinForms GUI (requires an interactive desktop session).
# Support files: ci/schema.sql, ci/mock_backend.py, ci/test.dump

on:
  push:
    branches: [debug]
  pull_request:
    branches: [debug]
  workflow_dispatch:

jobs:
  dicom-integration-test:
    runs-on: windows-latest

    steps:
      # -- 1. Checkout --------------------------------------------------------
      - name: Checkout
        uses: actions/checkout@v4

      # -- 2. Patch MWL App.config BEFORE building ----------------------------
      # Switch backend=3 so MWL queries our mock CARE API instead of MySQL.
      # The other services read all runtime config from cfg/common.cfg.
      - name: Patch CARE_MWL_Service App.config for CI
        shell: pwsh
        run: |
          [xml]$xml = Get-Content "CARE_MWL_Service\App.config"
          $s = $xml.configuration.appSettings.add
          ($s | Where-Object key -eq "backend").value      = "3"
          ($s | Where-Object key -eq "careBaseUrl").value  = "http://localhost:9000"
          ($s | Where-Object key -eq "careToken").value    = "ci-test-static-api-key"
          ($s | Where-Object key -eq "careModality").value = ""
          $xml.Save((Resolve-Path "CARE_MWL_Service\App.config").Path)
          Write-Output "MWL App.config patched (backend=3, careBaseUrl=http://localhost:9000)"

      # -- 3. Build full solution ---------------------------------------------
      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Setup NuGet
        uses: NuGet/setup-nuget@v2

      - name: Restore NuGet packages
        run: nuget restore CARE_DICOM_Enabler.sln

      - name: Build full solution (Release)
        run: |
          msbuild CARE_DICOM_Enabler.sln `
            /p:Configuration=Release `
            /p:Platform=AnyCPU `
            /m

      - name: Verify service EXEs were built
        shell: pwsh
        run: |
          $exes = @(
            "CARE_MWL_Service\bin\Release\CARE_MWL_Service.exe",
            "CARE_StoreSCP_Service\bin\Release\CARE_StoreSCP_Service.exe",
            "CARE_SCU_Service\bin\Release\CARE_SCU_Service.exe"
          )
          foreach ($e in $exes) {
            if (Test-Path $e) { Write-Output "FOUND  : $e" }
            else              { Write-Warning "MISSING: $e" }
          }

      # -- 4. MySQL setup -----------------------------------------------------
      # windows-latest ships MySQL 8.0; root has no password by default.
      - name: Start MySQL
        shell: pwsh
        run: |
          $mysql = "C:\Program Files\MySQL\MySQL Server 8.0\bin\mysql.exe"
          Start-Service MySQL80 -ErrorAction SilentlyContinue
          $ready = $false
          for ($i = 0; $i -lt 15; $i++) {
            & $mysql -u root -e "SELECT 1;" 2>$null
            if ($LASTEXITCODE -eq 0) { $ready = $true; break }
            Start-Sleep -Seconds 2
          }
          if (-not $ready) { Write-Error "MySQL did not become ready in 30s"; exit 1 }
          Write-Output "MySQL is ready"

      - name: Create plexus_mi2 schema
        shell: pwsh
        run: |
          $mysql = "C:\Program Files\MySQL\MySQL Server 8.0\bin\mysql.exe"
          & $mysql -u root < "ci\schema.sql"
          Write-Output "Schema applied (exit $LASTEXITCODE)"

      # -- 5. Generate cfg/common.cfg for each service ------------------------
      # Replicates CARE.DAL/EnDcryption.cs exactly:
      #   AES-256-CBC, key = EncKey.encdeKey, IV = 16 zero bytes, PKCS7 padding
      - name: Generate encrypted cfg/common.cfg for each service
        shell: pwsh
        run: |
          function Get-AesEncrypted([string]$plainText) {
            $key = [Text.Encoding]::UTF8.GetBytes("3DEA271411CD4AA0AC1499ACF35B0A9E")
            $iv  = New-Object byte[] 16
            $aes = [Security.Cryptography.Aes]::Create()
            $aes.Key     = $key
            $aes.IV      = $iv
            $aes.Mode    = [Security.Cryptography.CipherMode]::CBC
            $aes.Padding = [Security.Cryptography.PaddingMode]::PKCS7
            $enc = $aes.CreateEncryptor()
            $ms  = New-Object IO.MemoryStream
            $cs  = New-Object Security.Cryptography.CryptoStream($ms, $enc, [Security.Cryptography.CryptoStreamMode]::Write)
            $sw  = New-Object IO.StreamWriter($cs)
            $sw.Write($plainText); $sw.Close(); $cs.Close()
            return [Convert]::ToBase64String($ms.ToArray())
          }

          $enc = Get-AesEncrypted "Server=localhost;Database=plexus_mi2;Uid=root;Pwd=;"

          $xml  = '<?xml version="1.0" encoding="utf-8"?>'
          $xml += "<configurations>"
          $xml += "<connectString>$enc</connectString>"
          $xml += "<mwlaetitle>MODALITYSCP</mwlaetitle>"
          $xml += "<mwlport>2008</mwlport>"
          $xml += "<sscpaetitle>STORAGESCP</sscpaetitle>"
          $xml += "<sscpport>2007</sscpport>"
          $xml += "<sscuaetitle>STORAGESCU</sscuaetitle>"
          $xml += "<sscuhost>127.0.0.1</sscuhost>"
          $xml += "<callingaetitle>STORAGESCU</callingaetitle>"
          $xml += "<sscuport>2007</sscuport>"
          $xml += "<checkserver>false</checkserver>"
          $xml += "</configurations>"

          $dirs = @(
            "CARE_MWL_Service\bin\Release\cfg",
            "CARE_StoreSCP_Service\bin\Release\cfg",
            "CARE_SCU_Service\bin\Release\cfg",
            "CARE_Auth_Service\bin\Release\cfg"
          )
          foreach ($d in $dirs) {
            New-Item -ItemType Directory -Force -Path $d | Out-Null
            Set-Content -Path "$d\common.cfg" -Value $xml
            Write-Output "Created: $d\common.cfg"
          }

      # -- 6. Start mock CARE backend -----------------------------------------
      # ci/mock_backend.py serves worklist + upload endpoints on port 9000.
      - name: Start mock CARE backend
        shell: pwsh
        run: |
          $p = Start-Process python -ArgumentList "ci\mock_backend.py" -PassThru -NoNewWindow `
               -RedirectStandardOutput "$env:TEMP\mock.log" `
               -RedirectStandardError  "$env:TEMP\mock_err.log"
          echo "MOCK_PID=$($p.Id)" >> $env:GITHUB_ENV
          Start-Sleep -Seconds 3
          try {
            $r = Invoke-WebRequest "http://localhost:9000/" -UseBasicParsing -TimeoutSec 5
            Write-Output "Mock backend responding: HTTP $($r.StatusCode)"
          } catch {
            Write-Warning "Mock backend check: $_"
          }

      # -- 7. Install and start Windows services ------------------------------
      - name: Install DICOM services
        shell: pwsh
        run: |
          $svcs = @{
            CAREMWLci      = "CARE_MWL_Service\bin\Release\CARE_MWL_Service.exe"
            CAREStoreSCPci = "CARE_StoreSCP_Service\bin\Release\CARE_StoreSCP_Service.exe"
          }
          foreach ($kv in $svcs.GetEnumerator()) {
            $path = Resolve-Path $kv.Value -ErrorAction SilentlyContinue
            if (-not $path) { Write-Warning "Skipped $($kv.Key) - EXE not found"; continue }
            $r = sc.exe create $kv.Key binPath= "`"$($path.Path)`"" start= demand 2>&1
            Write-Output "Install $($kv.Key): $r"
          }

      - name: Start MWL and Store SCP services
        shell: pwsh
        run: |
          foreach ($svc in @("CAREMWLci", "CAREStoreSCPci")) {
            $r = sc.exe start $svc 2>&1
            Write-Output "Start $svc : $r"
          }
          Write-Output "Waiting 10s for services to bind ports..."
          Start-Sleep -Seconds 10

          foreach ($port in @(2007, 2008)) {
            $l = netstat -an | Select-String ":$port\s.*LISTENING"
            Write-Output "Port $port : $(if ($l) {'LISTENING'} else {'NOT listening'})"
          }
          foreach ($svc in @("CAREMWLci", "CAREStoreSCPci")) {
            sc.exe query $svc 2>&1 | Select-String "STATE"
          }

      # -- 8. DCMTK tests -----------------------------------------------------
      - name: Install DCMTK
        run: choco install dcmtk --yes --no-progress --timeout 180

      - name: "Test - C-ECHO to MWL SCP (port 2008)"
        shell: pwsh
        run: |
          $out = echoscu -v localhost 2008 -aet GITHUBCI -aec MODALITYSCP 2>&1
          Write-Output $out
          if ($LASTEXITCODE -ne 0) { Write-Error "C-ECHO MWL FAILED (exit $LASTEXITCODE)"; exit 1 }
          Write-Output "PASS: C-ECHO to MWL SCP port 2008"

      - name: "Test - C-ECHO to Store SCP (port 2007)"
        shell: pwsh
        run: |
          $out = echoscu -v localhost 2007 -aet GITHUBCI -aec STORAGESCP 2>&1
          Write-Output $out
          if ($LASTEXITCODE -ne 0) { Write-Error "C-ECHO StoreSCP FAILED (exit $LASTEXITCODE)"; exit 1 }
          Write-Output "PASS: C-ECHO to Store SCP port 2007"

      - name: "Test - C-FIND worklist query (patient should come from mock backend)"
        shell: pwsh
        run: |
          $out = findscu -v -S `
            -k "0008,0050=" `
            -k "0010,0010=" `
            -k "0010,0020=" `
            -k "0040,0100[0].0008,0060=CT" `
            localhost 2008 -aet GITHUBCI -aec MODALITYSCP 2>&1
          Write-Output $out
          if ($LASTEXITCODE -ne 0) {
            Write-Warning "C-FIND returned exit $LASTEXITCODE - association may have been refused"
          } else {
            Write-Output "PASS: C-FIND completed"
          }

      - name: Build test DICOM file from ci/test.dump
        shell: pwsh
        run: |
          dump2dcm "ci\test.dump" "$env:TEMP\ci_test.dcm"
          if (Test-Path "$env:TEMP\ci_test.dcm") {
            Write-Output "Test DICOM file: $((Get-Item "$env:TEMP\ci_test.dcm").Length) bytes"
          } else {
            Write-Error "dump2dcm failed to produce ci_test.dcm"; exit 1
          }

      - name: "Test - C-STORE send DICOM to Store SCP (port 2007)"
        shell: pwsh
        run: |
          $out = storescu -v localhost 2007 `
            -aet GITHUBCI -aec STORAGESCP `
            "$env:TEMP\ci_test.dcm" 2>&1
          Write-Output $out
          if ($LASTEXITCODE -ne 0) { Write-Error "C-STORE FAILED (exit $LASTEXITCODE)"; exit 1 }
          Write-Output "PASS: C-STORE to Store SCP port 2007"

      - name: Verify DICOM file received in SCP folder
        shell: pwsh
        run: |
          Start-Sleep -Seconds 5
          $total = 0
          foreach ($p in @("CARE_StoreSCP_Service\bin\Release\SCP", "SCP")) {
            if (Test-Path $p) {
              $files = Get-ChildItem -Path $p -Recurse -Filter "*.dcm"
              $total += $files.Count
              Write-Output "SCP folder '$p': $($files.Count) file(s)"
              $files | ForEach-Object { Write-Output "  $($_.FullName)" }
            }
          }
          if ($total -gt 0) { Write-Output "PASS: $total DICOM file(s) received and stored" }
          else              { Write-Warning "No .dcm files found in SCP folder(s)" }

      # -- 9. Cleanup and log collection --------------------------------------
      - name: Stop services and collect logs
        if: always()
        shell: pwsh
        run: |
          foreach ($svc in @("CAREMWLci", "CAREStoreSCPci")) {
            sc.exe stop   $svc 2>$null
            sc.exe delete $svc 2>$null
          }
          if ($env:MOCK_PID) {
            Stop-Process -Id $env:MOCK_PID -Force -ErrorAction SilentlyContinue
          }

          Write-Output "=== Mock backend stdout ==="
          if (Test-Path "$env:TEMP\mock.log")     { Get-Content "$env:TEMP\mock.log" }
          Write-Output "=== Mock backend stderr ==="
          if (Test-Path "$env:TEMP\mock_err.log") { Get-Content "$env:TEMP\mock_err.log" }

          Get-ChildItem -Recurse -Filter "*.txt" -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -match "\\logs\\" -and $_.FullName -notmatch "\\packages\\" } |
            ForEach-Object {
              Write-Output "=== $($_.FullName) (last 100 lines) ==="
              Get-Content $_.FullName -Tail 100 -ErrorAction SilentlyContinue
            }

      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dicom-test-results-${{ github.run_number }}-${{ github.sha }}
          path: |
            **/logs/*.txt
            **/SCP/**/*.dcm
          if-no-files-found: ignore
