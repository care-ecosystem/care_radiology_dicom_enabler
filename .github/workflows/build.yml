name: Build CARE DICOM Enabler

# Configurable Parameters (when triggered manually):
#   Build Settings:
#     - Build Configuration (Release/Debug)
#     - Platform (Any CPU, x86, x64)
#     - Parallel Build (enable/disable /m flag)
#     - Include Artifact Upload (yes/no)
#   CARE Server Settings (baked into EXE):
#     - CARE Server URL
#     - CARE API Token
#     - Scheduled Station AE Title
#     - Worklist From Date
#     - Max Upload Failures
#     - Max Upload Retries
#     - Worklist Refresh Start (seconds)
#     - Worklist Refresh Interval (seconds)
#
# CARE settings resolve in this order (first non-empty wins):
#   1. workflow_dispatch input   - one-off override for a manual run
#   2. environment secret / var  - the standing default for the environment
#                                  the run executes in (see below)
#   3. workflow default          - for the variables listed below
#   4. App.config committed value
#
# Environments (Settings > Environments):
#   staging   used by push/PR to main, manual runs, and plain vX.Y.Z tags
#             (e.g. v0.0.1 -> staging release). Holds the shared staging
#             server as secrets/vars.
#   <state>   used when a tag named <state>-vX.Y.Z is pushed, e.g.
#             jh-v1.0.0 -> environment "jh", ka-v1.0.0 -> environment "ka".
#             Holds that state's CARE_BASE_URL, CARE_API_TOKEN and vars,
#             which are baked into the build the same way as staging.
#             NOTE: tag builds are published as GitHub Releases. On a public
#             repo anyone can download the zip and read the baked token from
#             the .exe.config files, so treat these tokens as rotatable.
#
#   Secrets (masked in logs):
#     CARE_BASE_URL    e.g. https://care.example.org
#     CARE_API_TOKEN   the radiology plugin API token
#
#   Variables (optional overrides, printed in the log so not secrets; the
#   workflow default applies when neither an input nor a variable is set):
#     CARE_FROM_DATE                  default 2026-11-11 00:00:00  (worklist from date)
#     CARE_MAX_UPLOAD_RETRIES         default 10  (upload retries before FailedSCP)
#     CARE_WORKLIST_REFRESH_START     default 30  (seconds after start before the first worklist fetch)
#     CARE_WORKLIST_REFRESH_INTERVAL  default 30  (seconds between worklist fetches)
#
#   Backend mode is always 2 (CARE Server) and is not configurable.
#
# Releasing:
#   git tag v0.0.1    && git push origin v0.0.1      -> staging release
#   git tag jh-v1.0.0 && git push origin jh-v1.0.0   -> Jharkhand release
#   -> builds in environment "jh" and publishes a (draft) GitHub Release
#      with CARE_DICOM_Enabler-jh-v1.0.0.zip attached. Anyone can download:
#      https://github.com/<owner>/<repo>/releases/download/jh-v1.0.0/CARE_DICOM_Enabler-jh-v1.0.0.zip

on:
  push:
    branches:
      - main
    tags:
      - 'v[0-9]*'   # vX.Y.Z, e.g. v0.0.1 -> release built in "staging"
      - '*-v*'      # <environment>-vX.Y.Z, e.g. jh-v1.0.0, govtstaging-v0.0.1
  pull_request:
    branches:
      - main
  workflow_dispatch:  # Manual trigger with configurable inputs
    inputs:
      build_configuration:
        description: 'Build Configuration'
        required: false
        default: 'Release'
        type: choice
        options:
          - Release
          - Debug
      build_platform:
        description: 'Build Platform'
        required: false
        default: 'Any CPU'
        type: choice
        options:
          - Any CPU
          - x86
          - x64
      parallel_build:
        description: 'Enable Parallel Build (/m flag)'
        required: false
        default: true
        type: boolean
      upload_artifact:
        description: 'Upload Build Artifact'
        required: false
        default: true
        type: boolean
      care_server_url:
        description: 'CARE Server URL (baked into EXE)'
        required: false
        default: ''
        type: string
      care_api_token:
        description: 'CARE API Token (baked into EXE)'
        required: false
        default: ''
        type: string
      # Leave the four below blank to use the environment variable, or the
      # workflow default if the environment has none.
      care_from_date:
        description: 'Worklist From Date (baked into EXE). Default: 2026-11-11 00:00:00'
        required: false
        default: ''
        type: string
      max_upload_retries:
        description: 'Max Upload Retries before a file moves to FailedSCP (baked into EXE). Default: 10'
        required: false
        default: ''
        type: string
      worklist_refresh_start:
        description: 'Seconds after service start before the first worklist fetch (baked into EXE). Default: 30'
        required: false
        default: ''
        type: string
      worklist_refresh_interval:
        description: 'Seconds between worklist fetches (baked into EXE). Default: 30'
        required: false
        default: ''
        type: string

# Needed so GITHUB_TOKEN can create the GitHub Release on tag builds.
permissions:
  contents: write

jobs:
  # Work out which environment a run belongs to:
  #   push/PR to main, manual runs  -> staging
  #   tag vX.Y.Z                    -> staging   (staging release)
  #   tag <environment>-vX.Y.Z      -> <environment>, e.g. jh-v1.0.0 -> jh
  prep:
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.env.outputs.environment }}
    steps:
      - id: env
        shell: bash
        run: |
          if [ "$GITHUB_REF_TYPE" != "tag" ]; then
            env_name=staging
          elif [[ "$GITHUB_REF_NAME" =~ ^v[0-9] ]]; then
            env_name=staging
          else
            env_name="${GITHUB_REF_NAME%%-v*}"
            if [[ ! "$env_name" =~ ^[a-z][a-z0-9_-]{1,39}$ ]]; then
              echo "::error::Tag '$GITHUB_REF_NAME' must look like vX.Y.Z or <environment>-vX.Y.Z, e.g. v0.0.1 or jh-v1.0.0"
              exit 1
            fi
          fi
          echo "$GITHUB_REF_TYPE $GITHUB_REF_NAME -> environment '$env_name'"
          echo "environment=$env_name" >> "$GITHUB_OUTPUT"

  build:
    needs: prep
    runs-on: windows-latest
    environment: ${{ needs.prep.outputs.environment }}

    # Resolve CARE settings once: manual input wins, then environment secret/var.
    # Reading these through env (rather than inline ${{ }} in the script) keeps
    # GitHub's secret masking intact and avoids shell injection.
    env:
      # Sensitive -> Secrets (masked in logs)
      CARE_BASE_URL:  ${{ inputs.care_server_url != '' && inputs.care_server_url || secrets.CARE_BASE_URL }}
      CARE_API_TOKEN: ${{ inputs.care_api_token  != '' && inputs.care_api_token  || secrets.CARE_API_TOKEN }}
      # Always CARE Server mode. Not configurable.
      CARE_BACKEND: '2'
      # Non-sensitive -> Variables (printed in the log, so never secrets).
      # Resolution: manual input -> environment variable -> workflow default.
      CARE_FROM_DATE:                 ${{ inputs.care_from_date            != '' && inputs.care_from_date            || vars.CARE_FROM_DATE                 || '2026-11-11 00:00:00' }}
      CARE_MAX_UPLOAD_RETRIES:        ${{ inputs.max_upload_retries        != '' && inputs.max_upload_retries        || vars.CARE_MAX_UPLOAD_RETRIES        || '10' }}
      CARE_WORKLIST_REFRESH_START:    ${{ inputs.worklist_refresh_start    != '' && inputs.worklist_refresh_start    || vars.CARE_WORKLIST_REFRESH_START    || '30' }}
      CARE_WORKLIST_REFRESH_INTERVAL: ${{ inputs.worklist_refresh_interval != '' && inputs.worklist_refresh_interval || vars.CARE_WORKLIST_REFRESH_INTERVAL || '30' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Print which environment this run targets and what it resolved from it,
      # so a missing/empty environment is obvious before anything is built.
      # Variables are printed in full; secrets only as set/not set + length.
      - name: Show target environment and resolved CARE settings
        shell: pwsh
        env:
          TARGET_ENV: ${{ needs.prep.outputs.environment }}
          # Manual-run inputs and raw environment variables, so the table can
          # say where each resolved value came from.
          INPUT_CARE_BASE_URL:                  ${{ inputs.care_server_url }}
          INPUT_CARE_API_TOKEN:                 ${{ inputs.care_api_token }}
          INPUT_CARE_FROM_DATE:                 ${{ inputs.care_from_date }}
          INPUT_CARE_MAX_UPLOAD_RETRIES:        ${{ inputs.max_upload_retries }}
          INPUT_CARE_WORKLIST_REFRESH_START:    ${{ inputs.worklist_refresh_start }}
          INPUT_CARE_WORKLIST_REFRESH_INTERVAL: ${{ inputs.worklist_refresh_interval }}
          VAR_CARE_FROM_DATE:                   ${{ vars.CARE_FROM_DATE }}
          VAR_CARE_MAX_UPLOAD_RETRIES:          ${{ vars.CARE_MAX_UPLOAD_RETRIES }}
          VAR_CARE_WORKLIST_REFRESH_START:      ${{ vars.CARE_WORKLIST_REFRESH_START }}
          VAR_CARE_WORKLIST_REFRESH_INTERVAL:   ${{ vars.CARE_WORKLIST_REFRESH_INTERVAL }}
        run: |
          $targetEnv = $env:TARGET_ENV
          Write-Output "Target environment : $targetEnv"
          Write-Output "Trigger            : $env:GITHUB_EVENT_NAME ($env:GITHUB_REF_TYPE '$env:GITHUB_REF_NAME')"
          Write-Output "Backend mode       : $env:CARE_BACKEND (CARE Server, fixed)"
          Write-Output ""

          # FromEnv = what the environment itself supplied (secrets have no
          # workflow default, so their resolved value is the environment's).
          $settings = @(
            @{ Name = 'CARE_BASE_URL';                  Kind = 'secret';   Value = $env:CARE_BASE_URL;                  Input = $env:INPUT_CARE_BASE_URL;                  FromEnv = $env:CARE_BASE_URL }
            @{ Name = 'CARE_API_TOKEN';                 Kind = 'secret';   Value = $env:CARE_API_TOKEN;                 Input = $env:INPUT_CARE_API_TOKEN;                 FromEnv = $env:CARE_API_TOKEN }
            @{ Name = 'CARE_FROM_DATE';                 Kind = 'variable'; Value = $env:CARE_FROM_DATE;                 Input = $env:INPUT_CARE_FROM_DATE;                 FromEnv = $env:VAR_CARE_FROM_DATE }
            @{ Name = 'CARE_MAX_UPLOAD_RETRIES';        Kind = 'variable'; Value = $env:CARE_MAX_UPLOAD_RETRIES;        Input = $env:INPUT_CARE_MAX_UPLOAD_RETRIES;        FromEnv = $env:VAR_CARE_MAX_UPLOAD_RETRIES }
            @{ Name = 'CARE_WORKLIST_REFRESH_START';    Kind = 'variable'; Value = $env:CARE_WORKLIST_REFRESH_START;    Input = $env:INPUT_CARE_WORKLIST_REFRESH_START;    FromEnv = $env:VAR_CARE_WORKLIST_REFRESH_START }
            @{ Name = 'CARE_WORKLIST_REFRESH_INTERVAL'; Kind = 'variable'; Value = $env:CARE_WORKLIST_REFRESH_INTERVAL; Input = $env:INPUT_CARE_WORKLIST_REFRESH_INTERVAL; FromEnv = $env:VAR_CARE_WORKLIST_REFRESH_INTERVAL }
          )

          $fromEnvCount   = 0
          $missingSecrets = @()
          $rows           = @()
          Write-Output ("  {0,-32} {1,-9} {2,-8} {3,-26} {4}" -f 'SETTING', 'KIND', 'STATUS', 'SOURCE', 'VALUE')
          foreach ($s in $settings) {
            $value = "$($s.Value)"
            if ($value -eq '') {
              $status = 'NOT SET'
              $source = '-'
              $shown  = '(App.config default)'
              if ($s.Kind -eq 'secret') { $missingSecrets += $s.Name }
            } else {
              $status = 'set'
              if ("$($s.Input)" -ne '') {
                $source = 'manual input'
              } elseif ("$($s.FromEnv)" -ne '') {
                $source = "environment '$targetEnv'"
                $fromEnvCount++
              } else {
                $source = 'workflow default'
              }
              $shown = if ($s.Kind -eq 'secret') { "(hidden, $($value.Length) chars)" } else { $value }
            }
            Write-Output ("  {0,-32} {1,-9} {2,-8} {3,-26} {4}" -f $s.Name, $s.Kind, $status, $source, $shown)
            $rows += "| $($s.Name) | $($s.Kind) | $status | $source | $shown |"
          }

          Write-Output ""
          Write-Output "$fromEnvCount of $($settings.Count) CARE settings came from environment '$targetEnv'."
          if ($missingSecrets.Count -gt 0) {
            Write-Output "::warning::Environment '$targetEnv' did not provide $($missingSecrets -join ', '). Check Settings > Environments > '$targetEnv' exists and has these secrets. This build will use the committed App.config values for them."
          }

          # Same table in the run's Summary tab.
          $summary = @(
            "### CARE settings - environment ``$targetEnv``"
            ""
            "Trigger: $env:GITHUB_EVENT_NAME ($env:GITHUB_REF_TYPE ``$env:GITHUB_REF_NAME``) - backend 2 (CARE Server) - $fromEnvCount of $($settings.Count) settings from the environment"
            ""
            "| Setting | Kind | Status | Source | Value |"
            "|---|---|---|---|---|"
          ) + $rows
          $summary | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

      # Two services talk to CARE, through DIFFERENTLY NAMED keys in separate
      # config files. Patching only the MWL service leaves image upload
      # pointing at whatever is committed, which is the shared
      # staging server:
      #
      #   CARE_MWL_Service  careBaseUrl    -> worklist C-FIND, IN_PROGRESS / CANCELLED on MPPS
      #                     careToken
      #   CARE_SCU_Service  careBackendURL -> DICOM upload, scan status
      #                     staticAPIKey
      #
      # The root App.config (CARE_DICOM_Enabler.exe.config) carries a stale
      # copy of the SCU keys that no code reads; it is patched too so the
      # archive does not ship the staging URL and token in a third place.
      - name: Patch CARE settings into all service App.config files
        shell: pwsh
        run: |
          $serverUrl = "$env:CARE_BASE_URL"
          $apiToken  = "$env:CARE_API_TOKEN"
          $fromDate  = "$env:CARE_FROM_DATE"
          $backend   = "$env:CARE_BACKEND"
          $maxRetries  = "$env:CARE_MAX_UPLOAD_RETRIES"
          $refreshStart    = "$env:CARE_WORKLIST_REFRESH_START"
          $refreshInterval = "$env:CARE_WORKLIST_REFRESH_INTERVAL"

          foreach ($limit in @(@('Max Upload Retries', $maxRetries), @('Worklist Refresh Interval', $refreshInterval))) {
            if ($limit[1] -and $limit[1] -notmatch '^[1-9][0-9]*$') {
              Write-Error "$($limit[0]) must be a positive whole number, got '$($limit[1])'"
              exit 1
            }
          }
          # The start delay may be 0 (fetch immediately on service start).
          if ($refreshStart -and $refreshStart -notmatch '^[0-9]+$') {
            Write-Error "Worklist Refresh Start must be a whole number of seconds (0 or more), got '$refreshStart'"
            exit 1
          }

          if (-not ($serverUrl -or $apiToken -or $fromDate -or $backend -or $maxRetries -or $refreshStart -or $refreshInterval)) {
            Write-Output "No CARE settings supplied - keeping App.config defaults."
            exit 0
          }

          # Keys whose values are credentials: log a length, never the value.
          $secretKeys = @('careToken', 'staticAPIKey', 'jwtToken')

          function Update-ConfigFile([string]$path, [hashtable]$settings) {
            if (-not (Test-Path $path)) {
              Write-Warning "$path not found - skipped"
              return
            }

            [xml]$xml = Get-Content $path
            $adds = $xml.configuration.appSettings.add
            Write-Output "Patching $path"
            $applied = 0

            foreach ($key in $settings.Keys) {
              $value = $settings[$key]
              if ([string]::IsNullOrEmpty($value)) { continue }

              $node = $adds | Where-Object key -eq $key
              if ($null -eq $node) {
                Write-Warning "  key '$key' absent from $path - skipped"
                continue
              }

              $node.value = $value
              $applied++

              if ($secretKeys -contains $key) {
                Write-Output "  - $key = (set, $($value.Length) chars)"
              } else {
                Write-Output "  - $key = $value"
              }
            }

            if ($applied -gt 0) {
              $xml.Save((Resolve-Path $path).Path)
              Write-Output "  saved ($applied setting(s))"
            } else {
              Write-Output "  nothing to change"
            }
          }

          # Worklist
          Update-ConfigFile "CARE_MWL_Service\App.config" @{
            backend      = $backend
            careBaseUrl  = $serverUrl
            careToken    = $apiToken
            careFromDate = $fromDate
            worklistRefreshStartSeconds    = $refreshStart
            worklistRefreshIntervalSeconds = $refreshInterval
          }

          # DICOM upload, and the worklist refresh done when an uploaded file's
          # accession number is not in care_worklist (same from date as the MWL service)
          Update-ConfigFile "CARE_SCU_Service\App.config" @{
            careBackendURL    = $serverUrl
            staticAPIKey      = $apiToken
            maxUploadRetries  = $maxRetries
            careFromDate      = $fromDate
          }

          # Stale duplicates shipped in CARE_DICOM_Enabler.exe.config. The
          # WinForms UI reads cfg\common.cfg via cls_PlexusConfig, never its own
          # .exe.config, so nothing consumes these - they are rewritten only so
          # the archive stops shipping the staging URL in a third place.
          $authUrl = if ($serverUrl) { "$($serverUrl.TrimEnd('/'))/api/token/" } else { '' }
          Update-ConfigFile "App.config" @{
            careBackendURL = $serverUrl
            staticAPIKey   = $apiToken
            authURL        = $authUrl
          }

          Write-Output ""
          Write-Output "All CARE settings baked in - every service now targets the same server."

          # A wrong token is invisible until a modality issues a C-FIND and the
          # worklist comes back empty, because the .NET client swallows the HTTP
          # error. Print a fingerprint so the operator can compare it against the
          # server's CARE_RADIOLOGY_WEBHOOK_SECRET without either side echoing the
          # secret:  echo -n "$SECRET" | sha256sum
          if ($apiToken) {
            $sha = [System.Security.Cryptography.SHA256]::Create()
            $hash = [BitConverter]::ToString(
              $sha.ComputeHash([Text.Encoding]::UTF8.GetBytes($apiToken))
            ).Replace('-', '').ToLower()
            Write-Output "Token fingerprint (sha256, first 16): $($hash.Substring(0, 16))"
          }

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Setup NuGet
        uses: NuGet/setup-nuget@v2

      - name: Restore NuGet packages
        run: nuget restore CARE_DICOM_Enabler.sln

      - name: Display Build Configuration
        shell: pwsh
        run: |
          $config    = "${{ inputs.build_configuration || 'Release' }}"
          $platform  = "${{ inputs.build_platform || 'Any CPU' }}"
          $parallel  = "${{ inputs.parallel_build }}"
          $artifact  = "${{ inputs.upload_artifact }}"
          $serverUrl = "$env:CARE_BASE_URL"
          $backend   = "$env:CARE_BACKEND"

          Write-Output "Build Configuration:"
          Write-Output "  - Trigger: ${{ github.event_name }} (${{ github.ref_name }})"
          Write-Output "  - Configuration: $config"
          Write-Output "  - Platform: $platform"
          Write-Output "  - Parallel Build: $(if ($parallel -eq 'true' -or $parallel -eq '') { 'Enabled' } else { 'Disabled' })"
          Write-Output "  - Upload Artifact: $(if ($artifact -eq 'true' -or $artifact -eq '') { 'Yes' } else { 'No' })"

          if ($serverUrl -ne '' -or $backend -ne '') {
            Write-Output ""
            Write-Output "CARE Server Settings (baked into EXE):"
            Write-Output "  - Backend Mode: $backend (CARE Server, fixed)"
            if ($serverUrl -ne '') {
              Write-Output "  - Server URL: $serverUrl"
            }
          } else {
            Write-Output ""
            Write-Output "CARE Server Settings: Using defaults from App.config"
          }

      - name: Build Solution
        shell: pwsh
        run: |
          $config   = "${{ inputs.build_configuration || 'Release' }}"
          $platform = "${{ inputs.build_platform || 'Any CPU' }}"
          $parallel = "${{ inputs.parallel_build }}"

          # Build command
          $cmd = "msbuild CARE_DICOM_Enabler.sln /p:Configuration=$config /p:Platform=`"$platform`""

          # Add parallel flag if enabled (default true for push/PR, configurable for manual)
          if ($parallel -eq 'true' -or $parallel -eq '') {
            $cmd += " /m"
          }

          Write-Output "Executing: $cmd"
          Invoke-Expression $cmd

          if ($LASTEXITCODE -ne 0) {
            Write-Error "Build failed with exit code $LASTEXITCODE"
            exit $LASTEXITCODE
          }

      - name: Copy cfg and create logs dir
        shell: pwsh
        run: |
          $config = "${{ inputs.build_configuration || 'Release' }}"
          $binPath = "bin\$config"

          Write-Output "Setting up configuration for $config build..."
          New-Item -ItemType Directory -Force -Path "$binPath\cfg"
          Copy-Item cfg\common.cfg "$binPath\cfg\common.cfg"
          New-Item -ItemType Directory -Force -Path "$binPath\logs"
          Write-Output "Configuration files and directories created in $binPath"

          # common.cfg is read by CARE.Common (cls_PlexusConfig), not by
          # ConfigurationManager, so the App.config patching above never touches
          # it. Its authURL is what CARE_Auth_Service authenticates the app user
          # against (PlexusAuthService.cs:234 -> WebRequest.Create at :139), and
          # a failure there stops the DICOM services - so it must not be left
          # pointing at the shared staging server.
          #
          # connectString / uname / pwd are deliberately NOT rewritten: they are
          # AES-encrypted and the workflow holds no plaintext to re-encrypt.
          # Regenerate them locally with the GenerateConnectionString project.
          if ($env:CARE_BASE_URL) {
            $cfgPath = "$binPath\cfg\common.cfg"
            [xml]$cfg = Get-Content $cfgPath
            $node = $cfg.SelectSingleNode('/configurations/authURL')
            if ($node) {
              $node.InnerText = "$($env:CARE_BASE_URL.TrimEnd('/'))/api/token/"
              $cfg.Save((Resolve-Path $cfgPath).Path)
              Write-Output "  - cfg\common.cfg authURL = $($node.InnerText)"
            } else {
              Write-Warning "  authURL element absent from common.cfg - skipped"
            }
          }

      - name: Set short SHA and artifact name
        shell: pwsh
        run: |
          $shortSha = $env:GITHUB_SHA.Substring(0,7)
          echo "SHORT_SHA=$shortSha" >> $env:GITHUB_ENV

          # Build the artifact name here rather than inline in the upload step: upload-artifact
          # rejects names containing " : < > | * ? \ / CR LF, and a branch such as
          # "enhanc/facility_id" reaches us through github.ref_name with a slash in it.
          $config   = "${{ inputs.build_configuration || 'Release' }}"
          $platform = "${{ inputs.build_platform || 'AnyCPU' }}"
          $refLabel = "${{ github.event.pull_request.number || github.ref_name }}"

          $artifactName = "CARE_DICOM_Enabler-$config-$platform-$refLabel-$($env:GITHUB_RUN_NUMBER)-$shortSha"
          $artifactName = $artifactName -replace '[\\/:"<>|*?\r\n]', '-'   # invalid chars -> dash
          $artifactName = $artifactName -replace '\s+', ''                 # "Any CPU" -> "AnyCPU"
          $artifactName = $artifactName -replace '-{2,}', '-'              # collapse runs of dashes

          Write-Output "Artifact name: $artifactName"
          echo "ARTIFACT_NAME=$artifactName" >> $env:GITHUB_ENV

      - name: Upload Build Artifact
        if: ${{ inputs.upload_artifact != 'false' }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: bin\${{ inputs.build_configuration || 'Release' }}\
          if-no-files-found: error

      # Tag builds (jh-v1.0.0, ka-v1.0.0, ...) are also published as a GitHub
      # Release so a state can download without a GitHub account. Release
      # assets must be a file, so the build folder is zipped first.
      - name: Zip release build
        if: github.ref_type == 'tag'
        shell: pwsh
        run: |
          $config = "${{ inputs.build_configuration || 'Release' }}"
          $zip = "CARE_DICOM_Enabler-$($env:GITHUB_REF_NAME).zip"
          Compress-Archive -Path "bin\$config\*" -DestinationPath $zip -Force
          echo "RELEASE_ZIP=$zip" >> $env:GITHUB_ENV
          Write-Output "Release asset: $zip"

      - name: Publish GitHub Release
        if: github.ref_type == 'tag'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          $zip = $env:RELEASE_ZIP

          # --draft: the release is created but stays hidden until you press
          # Publish on GitHub, so the zip can be checked first. Remove the flag
          # once you are happy for state releases to go live automatically.
          gh release create $tag $zip --title $tag --generate-notes --draft
          if ($LASTEXITCODE -ne 0) {
            Write-Output "gh release create failed (release may already exist) - replacing the asset on the existing release."
            gh release upload $tag $zip --clobber
          }
